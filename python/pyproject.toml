[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formfabric"
version = "0.18.0"
description = "Python API for formfabric, the garment pattern and cloth simulation app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NodeAgentc, Inc." }]
dependencies = []

[project.urls]
Repository = "https://github.com/nodemode-dev/formfabric"

[tool.setuptools]
packages = ["formfabric"]

[tool.setuptools.package-data]
formfabric = ["catalogue.json"]
