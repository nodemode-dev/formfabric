[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["nodemode-ai"]
rust-version = "1.88"
publish = false

[workspace.dependencies]
ffb-core = { path = "crates/ffb-core" }
ffb-pattern = { path = "crates/ffb-pattern" }
ffb-fabric = { path = "crates/ffb-fabric" }
ffb-mesh = { path = "crates/ffb-mesh" }
ffb-io = { path = "crates/ffb-io" }
ffb-commands = { path = "crates/ffb-commands" }
glam = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
