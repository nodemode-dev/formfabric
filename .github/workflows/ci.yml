name: ci

on:
  push:
    branches: [main, 'compile_v*']
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older run. Runs on main and compile_v* are never cancelled: formcompiler
# releases a commit only when this workflow passed on that exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: One version across every site and the changelog
        run: python3 setup/version.py check
      - name: Every language table complete
        run: python3 setup/i18n.py check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
      - name: Check and clippy
        run: ./formfabric engine check
      - name: Browser engine
        run: ./formfabric engine wasm

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Window bundle where the freeze puts it
        run: |
          (cd ../frontend && npm ci && npm run build)
          cp -R ../frontend/dist frontend_dist
      - name: Service venv with the engine module
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt
          ../formfabric engine build
      - run: venv/bin/python formfabric_engine.py --selfcheck
      - name: Agent skill references match the engine catalogue
        working-directory: .
        run: ./formfabric agents sync --check
      - name: Agent setup, MCP configs and the shared panel's manifest
        working-directory: .
        run: ./formfabric agents check
      - name: Backend tests
        run: |
          venv/bin/pip install pytest httpx
          venv/bin/python -m pytest -q tests

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Shell script syntax
        run: |
          for f in $(git ls-files | xargs grep -lIE '^#!(/usr/bin/env bash|/bin/bash)'); do bash -n "$f"; echo "ok $f"; done
      - name: Python byte-compiles
        run: python -m compileall -q backend setup python

  desktop-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Apt mirror fallback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            grep -q mirrors.edge.kernel.org /etc/apt/apt-mirrors.txt || printf 'http://mirrors.edge.kernel.org/ubuntu/\tpriority:1\n' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
            grep -q '//archive.ubuntu.com' /etc/apt/apt-mirrors.txt || printf 'http://archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf 'Acquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Window bundle and sidecar placeholder the Tauri build script looks for
        run: |
          (cd frontend && npm ci && npm run build)
          mkdir -p src-tauri/binaries src-tauri/engine
          touch "src-tauri/binaries/formfabric-engine-$(rustc -vV | awk '/^host:/ {print $2}')"
      - name: Cargo check of the desktop shell
        working-directory: src-tauri
        run: cargo check --locked
      - name: Compile contract (./build_app --dry-run)
        run: |
          python3 -m venv backend/venv
          ./build_app --dry-run
